# A TLS-terminating proxy in front of the unauthenticated Ray dashboard.
#
# This is the shape the field actually takes: someone puts TLS in front of an
# orchestrator, considers it secured, and leaves the dashboard open behind it.
# RG-RAY-001 must still fire - over HTTPS, against a real server's handshake
# and a real self-signed certificate - and RG-TLS-001 must fire alongside it.
#
# Nothing here is hardened on purpose. Do not copy it anywhere.
server {
    listen 8265 ssl;
    server_name tls-proxy;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    location / {
        proxy_pass http://172.31.77.10:8265;
        proxy_set_header Host $host;
    }
}

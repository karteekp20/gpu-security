# Deliberately insecure AI infrastructure, for testing ray-guard's detections
# against real services rather than hand-written stubs.
#
# EVERY SERVICE HERE IS INTENTIONALLY MISCONFIGURED. Do not copy any of this
# into anything that touches a real network. It exists so that RG-RAY-001 and
# friends are proven against software that actually behaves like Ray, instead
# of against a mock that returns whatever we assumed Ray returns.
#
# Fidelity is mixed, and the split is deliberate rather than convenient:
#
#   REAL SERVICES  - ray, jupyter, mlflow, ollama, torchserve. All run
#                    CPU-only, so they are the genuine article here.
#   FIXTURES       - vllm, triton, sglang, dcgm-exporter. vLLM, SGLang and
#                    DCGM ship GPU-bound images; Triton's runs CPU-only but
#                    is 16GB, so the real one lives in the `heavy` profile
#                    (triton-real, below) and CI uses the fixture. They are
#                    represented by servers replaying the documented response
#                    shapes of their health endpoints, taken from each
#                    project's own docs, and are labelled as fixtures in the
#                    test output so nobody mistakes them for coverage.
#   LISTENER       - slurmctld. RG-SLURM-001 is a reachability-only check, so
#                    a bare TCP listener is a faithful stand-in, not a
#                    compromise.
#
# The `control-*` services are the other half of the test: correctly
# configured services that MUST NOT raise a finding. A scanner that cannot
# tell a secured service from an exposed one is worse than no scanner, and
# false positives are how a security tool loses a customer.

name: ray-guard-integration

networks:
  default:
    name: ray-guard-integration
    ipam:
      config:
        # Pinned so the -cidr discovery test has a known range to sweep.
        - subnet: 172.31.77.0/24

services:
  # ---------------------------------------------------------------- REAL ----

  # The flagship detection. Ray's dashboard bound to all interfaces with no
  # authentication is CVE-2023-48022 / CVE-2025-62593 - the ShadowRay
  # exposure. If RG-RAY-001 does not fire here, the product does not work.
  ray:
    image: rayproject/ray:2.9.0-py310
    command: >
      ray start --head
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --port=6379
      --ray-client-server-port=10001
      --block
    networks:
      default:
        ipv4_address: 172.31.77.10
    shm_size: 512mb

  jupyter:
    image: quay.io/jupyter/base-notebook:latest
    command: >
      start-notebook.py
      --IdentityProvider.token=''
      --PasswordIdentityProvider.hashed_password=''
      --ServerApp.ip=0.0.0.0
    networks:
      default:
        ipv4_address: 172.31.77.11

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    command: mlflow server --host 0.0.0.0 --port 5000
    networks:
      default:
        ipv4_address: 172.31.77.12

  ollama:
    image: ollama/ollama:latest
    networks:
      default:
        ipv4_address: 172.31.77.13

  # Real TorchServe, carrying the second critical detection
  # (RG-TORCHSERVE-001 / CVE-2023-43654). ~1.9GB and CPU-only, so there is no
  # excuse for leaving a Critical rule validated against a mock of our own.
  #
  # Note what is NOT configured here. No bind addresses are overridden,
  # because the official image's bundled config.properties already sets
  # inference, management, metrics and both gRPC addresses to 0.0.0.0.
  # Upstream's security page says "these ports are accessible to localhost by
  # default", which is true of a bare install and not of their own container.
  # Leaving the override out is deliberate: the stack should demonstrate that,
  # and fail loudly via wait-ready.sh if a future image changes it.
  #
  # The one thing changed is --disable-token-auth. TorchServe has enforced
  # token authorization by default since 0.12, so without that flag this rule
  # correctly does not fire - see control-torchserve-auth below, which is that
  # case. The flag exists because teams do turn it off.
  #
  # --model-store is mandatory even with nothing in it.
  torchserve:
    image: pytorch/torchserve:0.12.0-cpu
    command: >
      torchserve --start --foreground --ncs
      --disable-token-auth
      --model-store /home/model-server/model-store
    networks:
      default:
        ipv4_address: 172.31.77.22

  # ------------------------------------------------------------ FIXTURES ----
  # GPU-bound images; these replay documented health-endpoint shapes only.

  vllm:
    image: python:3.11-alpine
    working_dir: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    command: ["python", "/fixtures/shape_server.py", "vllm", "8000"]
    networks:
      default:
        ipv4_address: 172.31.77.20

  triton:
    image: python:3.11-alpine
    working_dir: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    command: ["python", "/fixtures/shape_server.py", "triton", "8002"]
    networks:
      default:
        ipv4_address: 172.31.77.21

  sglang:
    image: python:3.11-alpine
    working_dir: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    command: ["python", "/fixtures/shape_server.py", "sglang"]
    networks:
      default:
        ipv4_address: 172.31.77.23

  # Every GPU node runs one of these. Separate host because it is a different
  # kind of exposure from the inference servers above: not a control plane
  # anyone can drive, but an inventory of whose workload is on which GPU.
  dcgm-exporter:
    image: python:3.11-alpine
    working_dir: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    command: ["python", "/fixtures/shape_server.py", "dcgm"]
    networks:
      default:
        ipv4_address: 172.31.77.24

  # ------------------------------------------------- OPT-IN, REAL, HEAVY ----
  # Real Triton, CPU-only (no --gpus needed; NVIDIA's own quickstart says the
  # same image runs without one). In a profile because the image is 16GB,
  # which does not fit the ~14GB free disk on a standard GitHub runner - so
  # CI keeps the fixture on .21 and this is how a human verifies the fixture
  # is not lying:
  #
  #   docker compose --profile heavy up -d triton-real
  #   go test -tags integration ./test/integration/ -run RealTriton -v
  #
  # Verified 2026-10-10 against 26.09-py3 with an empty model repository:
  # /v2/health/ready 200, /metrics 200 on 8002, 8001 open, /v1/models 404
  # (so vLLM's path does not match it), and the wildcard control 404.
  triton-real:
    profiles: ["heavy"]
    image: nvcr.io/nvidia/tritonserver:26.09-py3
    command: >
      tritonserver --model-repository=/models
      --model-control-mode=explicit
      --strict-readiness=false
      --exit-on-error=false
    volumes:
      - ./fixtures/empty-model-repo:/models:ro
    networks:
      default:
        ipv4_address: 172.31.77.25

  # ------------------------------------------------------------ LISTENER ----

  slurmctld:
    image: alpine:3.19
    command: ["nc", "-lk", "-p", "6817", "-e", "/bin/true"]
    networks:
      default:
        ipv4_address: 172.31.77.30

  # ------------------------------------------------------- NEGATIVE CASES ----
  # Correctly configured. A service-exposure finding against either of these
  # is a false positive.

  # Authentication enforced on every path. The vLLM exposure rule must NOT
  # fire against it. It will still raise RG-TLS-002, because auth over
  # plaintext really is a finding - credentials cross the wire in the clear -
  # and the test asserts exactly that and nothing more.
  control-secured:
    image: python:3.11-alpine
    working_dir: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    command: ["python", "/fixtures/shape_server.py", "secured", "8000"]
    networks:
      default:
        ipv4_address: 172.31.77.40

  # Real TorchServe with its DEFAULT token authorization left on. The
  # management API is reachable, and RG-TORCHSERVE-001 must NOT fire against
  # it. Worth having as a real container rather than a stub because TorchServe
  # answers 400 here, not 401 - a detail no mock of ours would have invented,
  # and the reason the scan reports this host as an unidentified service at
  # Info instead of naming it.
  control-torchserve-auth:
    image: pytorch/torchserve:0.12.0-cpu
    command: >
      torchserve --start --foreground --ncs
      --model-store /home/model-server/model-store
    networks:
      default:
        ipv4_address: 172.31.77.42

  # Bound to loopback inside its own namespace: reachable from nowhere.
  control-loopback:
    image: python:3.11-alpine
    working_dir: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    command: ["python", "/fixtures/shape_server.py", "loopback", "8265"]
    networks:
      default:
        ipv4_address: 172.31.77.41

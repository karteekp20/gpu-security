name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable:
# whoever controls the action repository can repoint `v4` at new code, which
# would run inside a job that builds and signs the binaries people point at
# their GPU clusters. docs/threat-model.md T6 claims pinned actions; this is
# the claim being true. The trailing comment is the human-readable version and
# is what Dependabot rewrites on an update.
env:
  GO_VERSION: "1.27"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed in: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build (static, all release platforms)
        run: make build-all

      - name: Unit tests
        run: go test -race ./...

      # P3 is the guarantee the product is sold on. It gets its own step so a
      # failure here is unmistakable in the checks list, never buried in a
      # general test run (CLAUDE.md P3, 17).
      - name: Metadata-only enforcement (P3)
        run: go test -race -v ./test/...

      - name: Coverage (core logic)
        run: |
          go test -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # The action major must match the golangci-lint major: v7+ of the action
      # drives golangci-lint v2, and our .golangci.yml is a v2 config. The
      # action was on v6, which speaks v1 only - so this job could not have
      # enforced the config it was pointed at.
      #
      # The linter version is pinned rather than `latest` for the same reason:
      # a future golangci-lint v3 would silently turn the lint gate off again.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14

  # The Rego rule library (CLAUDE.md §8). Two gates, and they check different
  # things:
  #
  #   * `opa test` proves the rules mean what their tests say - including that
  #     a host nobody reached cannot close a finding, which is the property the
  #     signed credential rests on.
  #   * `opa check --strict` catches unused imports and shadowed names, which
  #     in Rego are usually a rule that silently never matches.
  #
  # The structural half - both sentinel halves present, metadata parseable, a
  # test per rule, and no drift from detect.go - runs in the Go suite
  # (internal/scan/rule_parity_test.go), so it gates every change even when
  # this job is not the one that fails.
  #
  # OPA is version-pinned, not `latest`: Rego v1 changed rule syntax, and an
  # engine that moves on its own would either break the library or quietly
  # change what it means. The action is SHA-pinned like every other.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.22.0

      - name: Lint the policy library
        run: opa check --strict policies/

      - name: Rule tests (both sentinel halves)
        run: opa test policies/ --verbose

      # The differential, over both halves of every sentinel. corpus.json is
      # generated from the Go detector and requires both implementations to
      # FIRE on the same observations. closures.json is generated from the
      # scanner's state vocabulary and requires every sentinel to CLOSE only
      # on evidence - no finding_condition reads host_state, so the finding
      # corpus is structurally blind to closure drift.
      #
      # opa test proves the rules mean what their own tests say; this proves
      # they mean what the shipping scanner does.
      - name: Differential against the Go detector
        run: python3 policies/tools/differential.py

  # We are a security product and therefore a high-value target (CLAUDE.md P8).
  # Scan our own dependencies and code on every change.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json

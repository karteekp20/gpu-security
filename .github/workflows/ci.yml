name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed in: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build (static, all release platforms)
        run: make build-all

      - name: Unit tests
        run: go test -race ./...

      # P3 is the guarantee the product is sold on. It gets its own step so a
      # failure here is unmistakable in the checks list, never buried in a
      # general test run (CLAUDE.md P3, 17).
      - name: Metadata-only enforcement (P3)
        run: go test -race -v ./test/...

      - name: Coverage (core logic)
        run: |
          go test -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # We are a security product and therefore a high-value target (CLAUDE.md P8).
  # Scan our own dependencies and code on every change.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json
